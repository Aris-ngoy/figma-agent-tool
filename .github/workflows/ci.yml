name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Lint, format, typecheck, build & test
    runs-on: ubuntu-latest
    env:
      TURBO_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bunx biome ci .
      - run: bunx turbo run build lint typecheck test

  npx:
    name: npx figma-agent-tool on Node LTS, without Bun
    runs-on: ubuntu-latest
    env:
      TURBO_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: package.json
      - run: bun install --frozen-lockfile
      - run: bunx turbo run build --filter=figma-agent-tool
      - run: bun pm pack --destination "$RUNNER_TEMP"
        working-directory: packages/mcp-server
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
      # The smoke script takes Bun off the PATH before running the package.
      - run: node packages/mcp-server/scripts/npx-smoke.mjs "$RUNNER_TEMP"/figma-agent-tool-*.tgz
        env:
          FIGMA_AGENT_CHROME: /usr/bin/google-chrome
